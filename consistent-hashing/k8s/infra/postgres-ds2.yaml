apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ds2
  labels:
    app: postgres-ds2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-ds2
  template:
    metadata:
      labels:
        app: postgres-ds2
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "ds_2"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ds2
spec:
  type: NodePort
  selector:
    app: postgres-ds2
  ports:
  - port: 5434
    targetPort: 5432
    nodePort: 30434

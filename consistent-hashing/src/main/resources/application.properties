spring.application.name=consistent-hashing
server.port=8081

# ==========================================
# 1. Disable Spring Boot auto datasource & JPA
#    We manage our own DataSources and
#    EntityManagerFactories manually (one per shard)
# ==========================================
# (Auto-configs are now excluded directly in ConsistentHashingApplication.java)

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable default Flyway (we run it manually per shard, same as sharding project)
spring.flyway.enabled=false

# ==========================================
# 2. Shard DataSource Config
#    name = node name used in ConsistentHashRing
#    These are passed to ring.addNode(name) on startup
# ==========================================
app.shards[0].name=ds0
app.shards[0].url=jdbc:postgresql://${SHARD_0_HOST:localhost}:${SHARD_0_PORT:5432}/${SHARD_0_DB:ds_0}
app.shards[0].username=${DB_USERNAME:postgres}
app.shards[0].password=${DB_PASSWORD:password}

app.shards[1].name=ds1
app.shards[1].url=jdbc:postgresql://${SHARD_1_HOST:localhost}:${SHARD_1_PORT:5433}/${SHARD_1_DB:ds_1}
app.shards[1].username=${DB_USERNAME:postgres}
app.shards[1].password=${DB_PASSWORD:password}

# ==========================================
# 3. Actuator
# ==========================================
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ==========================================
# 4. Swagger UI
# ==========================================
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Logging
logging.level.manjosh.labs=DEBUG

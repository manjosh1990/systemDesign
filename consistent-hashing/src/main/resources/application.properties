spring.application.name=consistent-hashing
server.port=8081

# Exclude Auto-Configurations (we manage data sources and JPA manually)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# ==========================================
# 1. The Master Metadata Database (ds0)
# ==========================================
# The application ONLY knows about this database on boot.
# All other shards are loaded dynamically from the shard_registry table inside ds0.
app.master.url=jdbc:postgresql://${SHARD_0_HOST:localhost}:${SHARD_0_PORT:5432}/${SHARD_0_DB:ds_0}
app.master.username=${DB_USERNAME:postgres}
app.master.password=${DB_PASSWORD:password}

# ==========================================
# 2. Swagger UI Customization
# ==========================================
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
